apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn
  namespace: longhorn-system

spec:
  entryPoints:
    - web
    - websecure

  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      middlewares:
        - name: longhorn-strip
      services:
        - name: longhorn-frontend
          port: 80