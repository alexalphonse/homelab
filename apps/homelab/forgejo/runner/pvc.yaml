apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-runner-docker-cache
  namespace: forgejo-runner
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn   # CHANGE: your storage class
  resources:
    requests:
      storage: 100Gi                     # Docker image cache — adjust as needed

