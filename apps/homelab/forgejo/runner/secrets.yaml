# Is this overwhelming?
# https://kubecraft.click/forgejo-k8s

# ExternalSecret for the Forgejo runner registration token
# Generate in Forgejo: Site Administration > Actions > Runners > Create Runner
# Or via CLI: forgejo actions generate-runner-token
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner-secret
  namespace: forgejo-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: your-secret-store        # CHANGE: your ClusterSecretStore name
    kind: ClusterSecretStore
  target:
    name: forgejo-runner-secret
  data:
    - secretKey: RUNNER_TOKEN
      remoteRef:
        key: forgejo-runner-token  # CHANGE: key name in your secret backend