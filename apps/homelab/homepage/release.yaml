apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: homepage-release
  namespace: homepage
spec:
  chart:
    spec:
      chart: homepage
      version: 2.x.x
      sourceRef:
        kind: HelmRepository
        name: homepage-repo
      interval: 1h
  interval: 1m0s
  releaseName: homepage

  values:
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn
      resources:
        requests:
          storage: 1Gi
    env:
      HOMEPAGE_ALLOWED_HOSTS: "*"
    
    config:
      bookmarks:
        - Developer:
            - Github:
                - abbr: GH
                  href: https://github.com
            - Personal website:
                - abbr: alexalphonse
                  href: https://alexalphonse.me
      settings:
        theme: dark # or light

      services:
        - Homelab:
            - Traefik:
                icon: traefik.png
                href: https://traefik.192.168.1.201.sslip.io/dashboard/#
                description: Network controller
                    
            - Grafana:
                icon: grafana.png
                href: http://192.168.1.201/grafana
                description: monitoring
                widget:
                  type: grafana
                  version: 2 # optional, default is 1
                  alerts: alertmanager # optional, default is grafana
                  url: http://192.168.1.201/grafana
                  username: admin
                  password: changme
                
            
            - Longhorn:
                icon: longhorn.png
                href: http://192.168.1.201/longhorn
                description: Longhorn storage
               
        
        - kubernetes:
            - Omni:
                icon: https://www.siderolabs.com/wp-content/uploads/2025/06/Omni.svg
                href: https://192.168.1.5:8080
                description: Cluster 

      widgets:
        - resources:
            cpu: true
            memory: true
            disk: /
      
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - pi
