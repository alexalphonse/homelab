apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: homepage-release
  namespace: homepage
spec:
  chart:
    spec:
      chart: homepage
      version: 2.x.x
      sourceRef:
        kind: HelmRepository
        name: homepage-repo
      interval: 1h
  interval: 1m0s
  releaseName: homepage

  values:
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn
      resources:
        requests:
          storage: 1Gi
    env:
      HOMEPAGE_ALLOWED_HOSTS: "*"
    
    config:
      bookmarks:
        - Developer:
            - Github:
                - abbr: GH
                  href: https://github.com

      services:
        - Homelab:
            - Traefik:
                href: http://192.168.1.201/dashboard
                description: Network controller
            
            - Grafana:
                href: http://192.168.1.201/grafana
                description: monitoring
            
            - Longhorn:
                href: http://192.168.1.201/longhorn
                description: storage


      widgets:
        - resources:
            cpu: true
            memory: true
            disk: /