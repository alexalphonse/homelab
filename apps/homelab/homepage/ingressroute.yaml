apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage
  namespace: homepage

spec:
  entryPoints:
    - web
    - websecure

  routes:
    - match: PathPrefix(`/homepage`)
      kind: Rule
      middlewares:
        - name: homepage-strip
      services:
        - name: homepage
          port: 3000

    - match: PathPrefix(`/homepage/api`)
      kind: Rule
      middlewares:
        - name: homepage-api-rewrite
      services:
        - name: homepage
          port: 3000